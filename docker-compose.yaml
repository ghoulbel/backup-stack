services:
  kopia:
    image: kopia/kopia@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e
    container_name: kopia
    # Pinned so the repository identity stays `root@kopia` across restarts.
    # Without it every `compose run` gets a random container ID as hostname,
    # which would spawn a new policy + maintenance owner per run.
    hostname: kopia
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - TZ=Europe/Zurich
      # Repository + UI credentials. Sourced from .env, never committed.
      - KOPIA_PASSWORD=${KOPIA_PASSWORD}
      - KOPIA_LOG_LEVEL=${KOPIA_LOG_LEVEL:-info}
    volumes:
      # Repository connection state, caches and logs.
      - ./kopia:/app/config
      # Repository destination on the Synology NAS (NFS).
      - /mnt/synology/backup/homelab:/backup
      # All stacks + ai-project, read-only.
      - ..:/source:ro
      # --- /hostconfig ---------------------------------------------------
      # Host-local state that lives OUTSIDE Documents/ and is therefore in no
      # git repository. Every one of these is impossible to regenerate:
      #   cloudflared/  246b168c-*.json holds the TunnelSecret. It cannot be
      #                 re-read or re-created -- the only alternative is a brand
      #                 new tunnel, which means deleting and recreating all nine
      #                 Cloudflare DNS records by hand.
      #   ssh/          the private key that pushes all nine repos. Lose it and
      #                 every repo needs a new deploy key.
      #   secrets/      opencode API keys.
      #   opencode/     config: which provider/model/endpoint the editor runs
      #                 on, plus the codebase-index embedding provider.
      #   hostconfig-*  fstab (the Synology NFS mount options) and the
      #                 cloudflared systemd unit.
      # Mounted read-only so a compromised or confused snapshot can never write
      # back into your home directory. Kopia itself only ever reads these.
      - ${HOME}/.cloudflared:/hostconfig/cloudflared:ro
      - ${HOME}/.ssh:/hostconfig/ssh:ro
      - ${HOME}/.config/secrets:/hostconfig/secrets:ro
      - ${HOME}/.config/opencode:/hostconfig/opencode:ro
      - ${HOME}/.config/hostconfig-fstab:/hostconfig/hostconfig-fstab:ro
      - ${HOME}/.config/hostconfig-etc:/hostconfig/hostconfig-etc:ro
    # `kopia server` runs the policy scheduler. The plain CLI does NOT
    # snapshot on a schedule, it must be triggered externally.
    command:
      - server
      - start
      - --address=0.0.0.0:5151
      # Plain HTTP is acceptable only because the published port is bound to
      # 127.0.0.1. If you ever expose this beyond loopback, drop --insecure
      # and use --tls-generate-cert / --tls-cert-file instead.
      - --insecure
      - --server-username=${KOPIA_SERVER_USER:-kopia}
      - --server-password=${KOPIA_SERVER_PASSWORD}
      - --enable-actions
      - --log-scheduler
      - --no-check-for-updates
    # Bound to loopback: the UI exposes full repository + control API.
    ports:
      - "127.0.0.1:5151:5151"
    healthcheck:
      # The REST API needs a session cookie, so basic-auth the UI root instead:
      # a 200 proves the server is up and the repository is connected.
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - -u
        - ${KOPIA_SERVER_USER:-kopia}:${KOPIA_SERVER_PASSWORD}
        - http://127.0.0.1:5151/
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"